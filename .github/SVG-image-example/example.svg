<svg width="400" height="150" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{TITLE}}">
  <style>
    .header { font: 700 18px 'Segoe UI', Ubuntu, sans-serif; fill: #f3eae6; }
    .description { font: 400 13px 'Segoe UI', Ubuntu, sans-serif; fill: #8d96a0; }
    .gray { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8d96a0; }
    .icon { fill: #79c0ff; }
  </style>

  <defs>
    <!-- Animated gradient border only -->
    <linearGradient id="f-borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30363d"/>
      <stop offset="0.5" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#30363d"/>
      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        from="0 0.5 0.5"
        to="360 0.5 0.5"
        dur="10s"
        repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="0.75" y="0.75" rx="6" width="398.5" height="148.5"
    fill="#0d1117" stroke="url(#f-borderGrad)" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(25, 35)">
    <path class="icon"
      d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"
      transform="translate(0, -13)"/>
    <text x="25" y="0" class="header">{{TITLE}}</text>
  </g>

  <!-- Description: always exactly 3 lines -->
  <g transform="translate(0, 55)">
    <text class="description" x="25" y="-5">
      <tspan dy="1.2em" x="25">{{LINE_1}}</tspan>
      <tspan dy="1.2em" x="25">{{LINE_2}}</tspan>
      <tspan dy="1.2em" x="25">{{LINE_3}}</tspan>
    </text>

    <!-- Language + stars -->
    <g transform="translate(30, 75)">
      <circle cx="0" cy="-5" r="5.5" fill="{{LANG_COLOR}}"/>
      <text class="gray" x="15">{{LANGUAGE}}</text>

      <path class="icon"
        d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25zm0 2.445L6.615 5.5a.75.75 0 01-.564.41l-3.097.45 2.24 2.184a.75.75 0 01.216.664l-.528 3.084 2.769-1.456a.75.75 0 01.698 0l2.77 1.456-.53-3.084a.75.75 0 01.216-.664l2.24-2.183-3.096-.45a.75.75 0 01-.564-.41L8 2.694z"
        transform="translate(135, -12)"/>
      <text class="gray" x="155">{{STARS}}</text>
    </g>
  </g>
</svg>
